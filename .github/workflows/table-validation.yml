name: Tables validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Design/Tables/**'
      - 'Design/genBin.bat'
      - 'Design/genBin.command'
      - 'Design/tools/**'
      - 'LayaProject/assets/**/tables/**'
      - 'LayaProject/settings/GameProject.json'
      - 'LayaProject/src/game/**/generated/**'
      - 'LayaProject/tools/luban.mjs'
      - '.github/workflows/table-validation.yml'
  pull_request:
    paths:
      - 'Design/Tables/**'
      - 'Design/genBin.bat'
      - 'Design/genBin.command'
      - 'Design/tools/**'
      - 'LayaProject/assets/**/tables/**'
      - 'LayaProject/settings/GameProject.json'
      - 'LayaProject/src/game/**/generated/**'
      - 'LayaProject/tools/luban.mjs'
      - '.github/workflows/table-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: LayaProject
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: LayaProject/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - run: npm ci
      - run: npm run tables:check
