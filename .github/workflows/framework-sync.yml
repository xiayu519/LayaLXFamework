name: Framework sync contract

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: LayaProject
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: LayaProject/package-lock.json
      - run: npm ci
      - run: npm run check:framework-upstream
      - run: npm run check:framework-integrity
      - run: npm run test:framework-sync
