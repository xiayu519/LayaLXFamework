name: Codex workflow regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Books/LXFamework-Codex-Workflow.md'
      - 'LayaProject/AGENTS.md'
      - 'LayaProject/.agents/**'
      - 'LayaProject/.codex/**'
      - 'LayaProject/src/game/**/AGENTS.md'
      - 'LayaProject/src/game/**/.agents/**'
      - 'LayaProject/src/game/**/.codex/**'
      - 'LayaProject/package.json'
      - 'LayaProject/package-lock.json'
      - 'LayaProject/tools/create-game.mjs'
      - 'LayaProject/tools/python-runtime.mjs'
      - 'LayaProject/tools/run-python.mjs'
      - 'LayaProject/tools/validate-skills.py'
      - 'LayaProject/tests/workflow/**'
      - '.github/workflows/codex-workflow.yml'
  push:
    branches:
      - main
    paths:
      - 'Books/LXFamework-Codex-Workflow.md'
      - 'LayaProject/AGENTS.md'
      - 'LayaProject/.agents/**'
      - 'LayaProject/.codex/**'
      - 'LayaProject/src/game/**/AGENTS.md'
      - 'LayaProject/src/game/**/.agents/**'
      - 'LayaProject/src/game/**/.codex/**'
      - 'LayaProject/package.json'
      - 'LayaProject/package-lock.json'
      - 'LayaProject/tools/create-game.mjs'
      - 'LayaProject/tools/python-runtime.mjs'
      - 'LayaProject/tools/run-python.mjs'
      - 'LayaProject/tools/validate-skills.py'
      - 'LayaProject/tests/workflow/**'
      - '.github/workflows/codex-workflow.yml'

permissions:
  contents: read

jobs:
  static-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: LayaProject
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: LayaProject/package-lock.json
      - run: npm ci
      - run: npm run check:skills
      - run: npm run check:memory
      - run: npm run validate:game-workflow
      - run: npm test -- tests/workflow
