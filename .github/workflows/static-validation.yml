name: Static validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LayaProject
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LayaProject/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: npm ci
      - run: npm run config:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:architecture
      - run: npm run validate:content-assets
      - run: npm run validate:resource-layout
      - run: npm run check:skills
      - run: npm run check:memory
