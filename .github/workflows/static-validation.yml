name: Cross-platform validation

on:
  push:
  pull_request:

jobs:
  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: LayaProject
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: LayaProject/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Cache LayaAir CLI 3.4.1
        uses: actions/cache@v5
        with:
          path: ~/.layaair
          key: layaair-cli-${{ runner.os }}-${{ runner.arch }}-3.4.1-a46451e
      - name: Install LayaAir CLI 3.4.1 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-RestMethod https://raw.githubusercontent.com/layabox/layaair-cli/a46451e060fa9f5dcb6537a71074b44eaf6a3d36/install.ps1 | Invoke-Expression
          if (!(Test-Path "$env:USERPROFILE\.layaair\3.4.1\Resources\cli-main.js")) {
            & "$env:USERPROFILE\.layaair\layaair.cmd" install 3.4.1
          }
      - name: Install LayaAir CLI 3.4.1 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/layabox/layaair-cli/a46451e060fa9f5dcb6537a71074b44eaf6a3d36/install.sh | bash
          if [ ! -f "$HOME/.layaair/3.4.1/Resources/cli-main.js" ]; then
            "$HOME/.layaair/layaair" install 3.4.1
          fi
      - run: npm ci
      - run: npm run check:framework-upstream
      - name: Verify Design table command on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: ..\Design\genBin.bat --no-pause
      - name: Verify Design table command on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: ../Design/genBin.command --no-pause
      - run: npm run verify
