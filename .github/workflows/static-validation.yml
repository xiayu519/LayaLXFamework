name: Static validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LayaProject
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LayaProject/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Install LayaAir CLI 3.4.1
        shell: pwsh
        run: |
          Invoke-RestMethod https://raw.githubusercontent.com/layabox/layaair-cli/a46451e060fa9f5dcb6537a71074b44eaf6a3d36/install.ps1 | Invoke-Expression
          & "$env:USERPROFILE\.layaair\layaair.cmd" install 3.4.1
      - run: npm ci
      - run: npm run tables:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:architecture
      - run: npm run validate:assets
      - run: npm run validate:content-assets
      - run: npm run validate:resource-layout
      - run: npm run validate:performance
      - run: npm run validate:game-workflow
      - run: npm run check:skills
      - run: npm run check:memory
